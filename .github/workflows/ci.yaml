# CI: build, vet, test, format, and lint the chart on every push/PR.
# Scaffold -- not wired to anything that gates merges yet; it documents the same
# commands CLAUDE.md lists for local dev so they also run in the open.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  go:
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -mod=mod
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: build / vet / test
        run: |
          go build ./...
          go vet ./...
          # The csi-sanity suite (internal/driver) is timing-sensitive on shared
          # runners -- a create-heavy spec occasionally exceeds its 60s deadline.
          # Give it ginkgo --flake-attempts so a transient timeout is retried, not
          # a red build. The flag is only defined for that ginkgo-based test binary,
          # so run the rest of the packages separately (a global -args would fail
          # their flag parsing with "flag provided but not defined").
          go test $(go list ./... | grep -v '/internal/driver$')
          go test ./internal/driver -args -ginkgo.flake-attempts=2
      - name: gofmt (must be empty)
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "unformatted:"; echo "$out"; exit 1; fi

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v5
      - name: lint + template the chart
        run: |
          helm lint charts/bard-csi
          # ceph-rbd profile: render WITH an instance and assert the sidecar and
          # BackendCluster actually appear. `enabled` alone emits no plugin
          # container, ConfigMap or BackendCluster at all (the profile keys off a
          # non-empty `instances` -- see _profiles.tpl), so the old instance-less
          # render succeeded while proving nothing about the ceph-rbd templates.
          out=$(helm template charts/bard-csi \
            --set plugins.ceph-rbd.enabled=true \
            --set-json 'plugins.ceph-rbd.instances={"galileo":{"monitors":["192.0.2.1:3300"],"pool":"k8s-csi-test","user":"k8s-csi-test","default":true}}' \
            --set installCRDs=true)
          echo "$out" | grep -q bard-plugin-ceph-rbd || { echo "ceph-rbd profile rendered no plugin sidecar"; exit 1; }
          echo "$out" | grep -q "kind: BackendCluster" || { echo "ceph-rbd profile rendered no BackendCluster"; exit 1; }
          # iscsi profile: positive render with attach on (the only attach-style
          # backend -- see templates/_validate.tpl)
          helm template bard charts/bard-csi --set attach.enabled=true --set plugins.iscsi.enabled=true \
            --set-json 'plugins.iscsi.instances={"galileo":{"vg":"bard-vg","portal":"192.0.2.1:3260","thinPool":"bard-thin","chapAuth":true}}' >/dev/null
          # iscsi profile: negative guard -- must FAIL the render without attach.enabled,
          # and with the intended guard message (not some unrelated render error)
          if err=$(helm template bard charts/bard-csi --set plugins.iscsi.enabled=true \
            --set-json 'plugins.iscsi.instances={"g":{"vg":"v","portal":"192.0.2.1:3260"}}' 2>&1 >/dev/null); then
            echo "guard did not fire"; exit 1
          fi
          echo "$err" | grep -q "requires attach.enabled" || { echo "guard fired for the wrong reason:"; echo "$err"; exit 1; }
          # iscsi profile: a management: targetd instance renders (no vg, no local
          # controller-placement coupling) with a controller-only targetd creds mount
          helm template bard charts/bard-csi --set attach.enabled=true --set plugins.iscsi.enabled=true \
            --set-json 'plugins.iscsi.instances={"remote":{"management":"targetd","targetdEndpoint":"http://192.0.2.5:18700/targetrpc","targetdPool":"vg-targetd","targetIqn":"iqn.2003-01.org.linux-iscsi.host:targetd","portal":"192.0.2.5:3260"}}' >/dev/null
      # Metrics wiring. Each assertion below corresponds to a way this has
      # already been broken: the node shipped --metrics-addr with no
      # containerPort (unreachable), and giving every sidecar the port name
      # "metrics" makes the whole controller pod invalid, since port names must
      # be unique within a pod -- neither is caught by `helm lint`.
      - name: metrics wiring renders and is scrapeable
        run: |
          set -euo pipefail
          # Ports pinned here rather than inherited from values.yaml, so this
          # proves the wiring independently of whatever the defaults become.
          on=(--set metrics.enabled=true --set metrics.serviceMonitor.enabled=true
              --set metrics.podMonitor.enabled=true --set metrics.dashboard.enabled=true
              --set attach.enabled=true --set metrics.port=9809 --set metrics.nodePort=9815)

          node=$(helm template bard charts/bard-csi "${on[@]}" --show-only templates/node.yaml)
          echo "$node" | grep -q -- "--metrics-addr=:9815" || { echo "node core has no --metrics-addr"; exit 1; }
          echo "$node" | grep -q "containerPort: 9815" || { echo "node core declares no metrics containerPort"; exit 1; }

          # Disabling the liveness sidecar must also remove the core's healthz
          # declaration and probe. Metrics remain independently renderable, even
          # when they intentionally use the former healthz port.
          no_liveness=$(helm template bard charts/bard-csi \
            --set metrics.enabled=true --set metrics.port=9808 \
            --set sidecars.livenessProbe.enabled=false \
            --show-only templates/controller.yaml)
          echo "$no_liveness" | grep -q -- "--metrics-addr=:9808" \
            || { echo "metrics did not render with liveness disabled"; exit 1; }
          echo "$no_liveness" | grep -qE '^[[:space:]]+- name: metrics$' \
            || { echo "metrics containerPort is missing with liveness disabled"; exit 1; }
          echo "$no_liveness" | grep -q "containerPort: 9808" \
            || { echo "metrics containerPort has the wrong value with liveness disabled"; exit 1; }
          if echo "$no_liveness" | grep -q "name: liveness-probe"; then
            echo "liveness-probe sidecar rendered while disabled"; exit 1
          fi
          if echo "$no_liveness" | grep -q "name: healthz"; then
            echo "healthz containerPort rendered while liveness is disabled"; exit 1
          fi
          if echo "$no_liveness" | grep -q "path: /healthz"; then
            echo "Kubernetes healthz probe rendered while liveness is disabled"; exit 1
          fi

          # The controller and node Pods have separate network namespaces by
          # default, so each cross-plane csi-addons port is safe to reuse.
          helm template bard charts/bard-csi --set metrics.enabled=true \
            --set sidecars.csiAddons.enabled=true --set metrics.port=9070 >/dev/null
          helm template bard charts/bard-csi --set metrics.enabled=true \
            --set sidecars.csiAddons.enabled=true --set metrics.nodePort=9071 >/dev/null
          # A node-only hostNetwork profile (Ceph RBD) still leaves the controller
          # Pod isolated, so it must not turn a safe cross-plane reuse into a failure.
          helm template bard charts/bard-csi --set metrics.enabled=true \
            --set sidecars.csiAddons.enabled=true --set metrics.nodePort=9071 \
            --set plugins.ceph-rbd.enabled=true \
            --set-json 'plugins.ceph-rbd.instances={"galileo":{"monitors":["192.0.2.1:3300"],"pool":"k8s-csi-test","user":"k8s-csi-test","default":true}}' >/dev/null

          # Metrics listeners also must not take fixed same-Pod ports. These
          # checks assert the actionable reason, not just that Helm rejected the
          # render, because a generic failure could be an unrelated chart bug.
          expect_reserved_collision() {
            local label="$1"
            local needle="$2"
            shift 2
            local err
            if err=$(helm template bard charts/bard-csi "$@" 2>&1 >/dev/null); then
              echo "${label}: reserved-port guard did not fire"; exit 1
            fi
            echo "$err" | grep -Fq "$needle" || {
              echo "${label}: reserved-port guard named the wrong reason:"; echo "$err"; exit 1;
            }
          }

          expect_reserved_collision "metrics.port vs liveness" \
            "sidecars.livenessProbe health port" \
            --set metrics.enabled=true --set sidecars.livenessProbe.enabled=true --set metrics.port=9808
          expect_reserved_collision "metrics.port vs csi-addons controller" \
            "sidecars.csiAddons controller port" \
            --set metrics.enabled=true --set sidecars.csiAddons.enabled=true --set metrics.port=9071
          expect_reserved_collision "metrics.nodePort vs csi-addons node" \
            "sidecars.csiAddons node controller port" \
            --set metrics.enabled=true --set sidecars.csiAddons.enabled=true --set metrics.nodePort=9070

          # iSCSI puts both planes on hostNetwork, so the same cross-plane
          # values must fail with the fixed listener named in the error.
          expect_reserved_collision "hostNetwork metrics.port vs csi-addons node" \
            "sidecars.csiAddons node controller port across hostNetwork planes" \
            --set metrics.enabled=true --set sidecars.csiAddons.enabled=true --set metrics.port=9070 \
            --set attach.enabled=true --set plugins.iscsi.enabled=true \
            --set-json 'plugins.iscsi.instances={"galileo":{"vg":"bard-vg","portal":"192.0.2.1:3260","thinPool":"bard-thin","chapAuth":true}}'
          expect_reserved_collision "hostNetwork metrics.nodePort vs csi-addons controller" \
            "sidecars.csiAddons controller port across hostNetwork planes" \
            --set metrics.enabled=true --set sidecars.csiAddons.enabled=true --set metrics.nodePort=9071 \
            --set attach.enabled=true --set plugins.iscsi.enabled=true \
            --set-json 'plugins.iscsi.instances={"galileo":{"vg":"bard-vg","portal":"192.0.2.1:3260","thinPool":"bard-thin","chapAuth":true}}'

          # The node port must not equal the controller port: a hostNetwork
          # profile (iscsi sets it on BOTH planes) puts them in the same host
          # netns, and the loser silently fails to bind.
          if helm template bard charts/bard-csi --set metrics.enabled=true \
               --set metrics.nodePort=9809 >/dev/null 2>&1; then
            echo "port-collision guard did not fire for nodePort == metrics.port"; exit 1
          fi

          ctrl=$(helm template bard charts/bard-csi "${on[@]}" --show-only templates/controller.yaml)
          n=$(echo "$ctrl" | grep -c -- "--http-endpoint=:") || true
          [ "$n" = "5" ] || { echo "expected 5 sidecar --http-endpoint flags, got $n"; exit 1; }
          dupes=$(echo "$ctrl" | grep -oE "name: metrics[a-z-]*" | sort | uniq -d)
          [ -z "$dupes" ] || { echo "duplicate containerPort names in one pod:"; echo "$dupes"; exit 1; }

          for t in metrics-service metrics-servicemonitor metrics-podmonitor grafana-dashboard; do
            helm template bard charts/bard-csi "${on[@]}" --show-only "templates/$t.yaml" >/dev/null \
              || { echo "$t did not render"; exit 1; }
          done

          # A ServiceMonitor endpoint naming a port the Service does not publish
          # scrapes nothing, silently. Assert the two lists agree.
          svc=$(helm template bard charts/bard-csi "${on[@]}" --show-only templates/metrics-service.yaml \
                | grep -oE "^    - name: metrics[a-z-]*" | awk '{print $3}' | sort)
          sm=$(helm template bard charts/bard-csi "${on[@]}" --show-only templates/metrics-servicemonitor.yaml \
               | grep -oE "^    - port: metrics[a-z-]*" | awk '{print $3}' | sort)
          [ "$svc" = "$sm" ] || { echo "Service ports and ServiceMonitor endpoints disagree:"; diff <(echo "$svc") <(echo "$sm") || true; exit 1; }

          # Prometheus must preserve Bard's instance/endpoint labels. Assert the
          # six default controller endpoints and the node endpoint all opt into
          # honorLabels; a missing one must fail independently of the others.
          sm_render=$(helm template bard charts/bard-csi "${on[@]}" \
            --show-only templates/metrics-servicemonitor.yaml)
          sm_endpoints=$(echo "$sm_render" | grep -cE '^    - port: metrics[a-z-]*$' || true)
          sm_honor=$(echo "$sm_render" | grep -cE '^      honorLabels: true$' || true)
          [ "$sm_endpoints" = "6" ] || { echo "expected 6 ServiceMonitor endpoints, got $sm_endpoints"; exit 1; }
          [ "$sm_honor" = "$sm_endpoints" ] || { echo "every ServiceMonitor endpoint must set honorLabels: true (got $sm_honor/$sm_endpoints)"; exit 1; }

          pm_render=$(helm template bard charts/bard-csi "${on[@]}" \
            --show-only templates/metrics-podmonitor.yaml)
          pm_endpoints=$(echo "$pm_render" | grep -cE '^    - port: metrics$' || true)
          pm_honor=$(echo "$pm_render" | grep -cE '^      honorLabels: true$' || true)
          [ "$pm_endpoints" = "1" ] || { echo "expected 1 PodMonitor endpoint, got $pm_endpoints"; exit 1; }
          [ "$pm_honor" = "$pm_endpoints" ] || { echo "PodMonitor endpoint must set honorLabels: true (got $pm_honor/$pm_endpoints)"; exit 1; }

          # Metrics off must stay entirely off. Written as `if` rather than
          # `grep -q ... && exit 1`, which under `set -e` aborts the script on the
          # HEALTHY path (grep returns 1 when it finds nothing).
          off=$(helm template bard charts/bard-csi)
          if echo "$off" | grep -q -- "--metrics-addr"; then
            echo "metrics-addr present with metrics disabled"; exit 1
          fi
          if echo "$off" | grep -qE "kind: (ServiceMonitor|PodMonitor)"; then
            echo "monitor CRs present with metrics disabled"; exit 1
          fi

          python3 -c "import json;json.load(open('charts/bard-csi/dashboards/bard-csi.json'))" \
            || { echo "dashboard JSON is invalid"; exit 1; }
          echo "metrics wiring OK"

      # The install version the docs hand a reader is part of the product: an
      # unpinned install cannot reach a pre-release at all and silently resolves
      # to the latest stable instead, and a stale pin quietly installs the wrong
      # release. Covers README.md, docs/quickstart.md and the chart README.
      - name: documented install version is consistent
        run: bash hack/check-doc-versions.sh

  conformance:
    # The wire-contract bar: drive the Python localpath plugin (which shares no
    # code with the tool) over its unix socket with bard-plugin-conformance.
    # Control plane as the runner user, then again under sudo to add the node
    # plane (real bind mounts). The tool is prebuilt into the workspace temp
    # dir so the sudo run reuses it (go isn't on root's PATH) and neither run
    # writes a root-owned binary through a sticky /tmp path.
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -mod=mod
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: build the conformance tool
        run: go build -o "$RUNNER_TEMP/bard-plugin-conformance" ./cmd/bard-plugin-conformance
      - name: conformance -- control plane
        run: TOOL="$RUNNER_TEMP/bard-plugin-conformance" bash hack/conformance-localpath-test.sh
      - name: conformance -- node plane (root)
        run: sudo env TOOL="$RUNNER_TEMP/bard-plugin-conformance" bash hack/conformance-localpath-test.sh
      - name: plugin log on failure
        if: failure()
        run: sudo cat /tmp/lp-conf-plugin.*.log || true
